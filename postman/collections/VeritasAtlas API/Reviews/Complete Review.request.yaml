$kind: http-request
name: Complete Review
method: POST
url: '{{baseUrl}}/api/v1/reviews/{{reviewId}}/complete'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "decision": "Approved",
      "reviewer": "editor@example.com",
      "notes": "All claims verified and accurate."
    }

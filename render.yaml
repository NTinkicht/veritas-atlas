# Only sync after independently reviewed merge; no changes to HUMAN/lego-teddy.
services:
  - type: web
    name: veritas-atlas-api-ntinkicht
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Auth__Jwt__Secret
        generateValue: true
      - key: Auth__Bootstrap__Username
        value: stagingadmin
      - key: Auth__Bootstrap__Password
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://veritas-atlas-web-ntinkicht.onrender.com

  - type: web
    name: veritas-atlas-web-ntinkicht
    runtime: static
    branch: main
    autoDeployTrigger: off
    buildCommand: cd apps/web/veritas-atlas-web && npm ci && npm run build
    staticPublishPath: apps/web/veritas-atlas-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: VITE_API_BASE_URL
        value: https://veritas-atlas-api-ntinkicht.onrender.com

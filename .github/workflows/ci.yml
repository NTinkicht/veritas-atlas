name: Veritas Atlas CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner availability diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub-hosted runner
        run: echo "github-hosted-runner-ready"

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VeritasAtlas.slnx

      - name: Build
        run: dotnet build VeritasAtlas.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/VeritasAtlas.Api.Tests/VeritasAtlas.Api.Tests.csproj --configuration Release --no-build

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/veritas-atlas-web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/veritas-atlas-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  container-build:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --file Dockerfile --tag veritas-atlas-api:ci .

  staging-migration-script:
    name: Staging migration SQL (review only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Install matching EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.5
      - name: Restore NuGet packages
        run: dotnet restore VeritasAtlas.slnx
      - name: Generate SQL without connecting to a database
        working-directory: apps/api/VeritasAtlas.Infrastructure
        run: |
          dotnet ef migrations script 0 --idempotent \
            --project . \
            --startup-project ../VeritasAtlas.Api \
            --context VeritasAtlasDbContext \
            --output "$GITHUB_WORKSPACE/staging-ef-migration.sql"
          test -s "$GITHUB_WORKSPACE/staging-ef-migration.sql"
          grep -q '__EFMigrationsHistory' "$GITHUB_WORKSPACE/staging-ef-migration.sql"
          grep -q 'CREATE TABLE' "$GITHUB_WORKSPACE/staging-ef-migration.sql"
          sha256sum "$GITHUB_WORKSPACE/staging-ef-migration.sql"
      - name: Upload review-only SQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: veritas-staging-ef-migration-sql
          path: staging-ef-migration.sql
          if-no-files-found: error
          retention-days: 3

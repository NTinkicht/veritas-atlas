name: Native Factory Merge Controller

on:
  workflow_run:
    workflows:
      - Veritas Atlas CI
    types:
      - completed
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: native-factory-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile exact-head merge gates from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS_JSON: >-
            ["Runner availability diagnostic","Backend build, tests and dependency audit","Frontend build, lint and dependency audit","Backend Docker image build","Staging migration SQL (review only)","Staging HTTP smoke (unauthenticated)"]
        run: python scripts/native_factory_merge.py

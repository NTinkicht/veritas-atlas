name: L5 Guarded Write Adapter CI

on:
  pull_request:
    paths:
      - 'scripts/l5_recovery.py'
      - 'scripts/l5_write_adapter.py'
      - 'tests/test_l5_write_adapter.py'
      - '.github/workflows/l5-write-adapter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-write-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: L5 guarded write adapter fault regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile L5 write path
        run: python -m py_compile scripts/l5_state_machine.py scripts/l5_recovery.py scripts/l5_write_adapter.py tests/test_l5_write_adapter.py
      - name: Run recovery selftest
        run: python scripts/l5_recovery.py --selftest
      - name: Run guarded write regressions
        run: python tests/test_l5_write_adapter.py

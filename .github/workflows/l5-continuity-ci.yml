name: L5 Continuity Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_continuity.py'
      - 'scripts/l5_continuity_policy.json'
      - '.github/workflows/l5-continuity-*.yml'

permissions:
  contents: read

jobs:
  continuity-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate deterministic L5 continuity invariants
        run: python scripts/l5_continuity.py --selftest

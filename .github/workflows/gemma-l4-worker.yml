name: Gemma L4 Worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Bounded engineering task"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run bounded OpenRouter Gemma task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "OPENROUTER_API_KEY is not configured"; exit 78; }
          git diff --quiet && git diff --cached --quiet || { echo "Checkout must start clean"; exit 1; }
          HEAD_BEFORE="$(git rev-parse HEAD)"
          git diff --no-ext-diff --unified=3 HEAD^ HEAD -- . > gemma-repo-context.txt
          head -c 60000 gemma-repo-context.txt > gemma-repo-context.bounded
          mv gemma-repo-context.bounded gemma-repo-context.txt
          python - <<'PY'
          import json, os, urllib.request
          context = open("gemma-repo-context.txt", encoding="utf-8", errors="replace").read()
          payload = {
              "model": "google/gemma-3-27b-it:free",
              "messages": [
                  {"role": "system", "content": open("GEMINI.md", encoding="utf-8").read()},
                  {"role": "user", "content": os.environ["TASK"] + "\n\nCurrent HEAD: " + os.environ.get("GITHUB_SHA", "") + "\nBounded current diff:\n" + context},
              ],
          }
          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"],
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              data = json.load(response)
          text = data["choices"][0]["message"]["content"]
          open("gemma-l4-result.md", "w", encoding="utf-8").write(text + "\n")
          PY
          test "$(git rev-parse HEAD)" = "$HEAD_BEFORE"
          git diff --exit-code -- . ':!gemma-l4-result.md' ':!gemma-repo-context.txt'
          echo "Gemma output captured as an untrusted job artifact; this worker has no repository write or review credential."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gemma-l4-result
          path: gemma-l4-result.md
          if-no-files-found: error

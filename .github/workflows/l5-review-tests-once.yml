name: L5 Review Tests Once

on:
  push:
    paths:
      - '.github/workflows/l5-review-tests-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Add focused bridge and freeze tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_l5_controller.py')
          s = p.read_text()
          anchor = '    def test_deterministic_selection_prefers_repair_over_review(self):\n'
          insert = '''    def test_merge_locked_survives_governance_drift(self):
        """A governance freeze cannot erase pending post-merge verification."""
        store = MemoryCASStore()
        store.modes["repo"] = (RepoMode.MERGE_LOCKED, 3)
        io = FakeIO(repo_snapshot(rulesets_or_protection_active=False))
        result = run_once("repo", io, store)
        self.assertEqual(result.status, "BLOCKED")
        self.assertEqual(result.reason, "GOVERNANCE_DRIFT")
        self.assertEqual(store.read_repo_mode("repo")[0], RepoMode.MERGE_LOCKED)

    def test_bridge_rejects_lease_ref_mismatches(self):
        """The concrete write bridge rejects head/base drift before mutation."""
        obs = Observation("a" * 40, "b" * 40)
        intent = Intent("op", "f" * 64, "ci_rerun", obs.head, obs.base, 1)
        lease = Lease("k", "run", 1, obs, 0.0, 300.0, 1, intent)
        bridge = GuardedWriteBridge(object(), object())
        head = bridge.execute_guarded("retry_ci", {"head_sha": "c" * 40, "base_sha": obs.base}, lease)
        base = bridge.execute_guarded("retry_ci", {"head_sha": obs.head, "base_sha": "d" * 40}, lease)
        self.assertEqual(head["reason"], "LEASE_HEAD_MISMATCH")
        self.assertEqual(base["reason"], "LEASE_BASE_MISMATCH")

    def test_bridge_turns_invalid_authorization_into_blocked(self):
        """Invalid activation evidence cannot orphan a PENDING intent."""
        obs = Observation("a" * 40, "b" * 40)
        intent = Intent("op", "f" * 64, "ci_rerun", obs.head, obs.base, 1)
        lease = Lease("k", "run", 1, obs, 0.0, 300.0, 1, intent)
        bridge = GuardedWriteBridge(object(), object())
        result = bridge.execute_guarded(
            "retry_ci",
            {"head_sha": obs.head, "base_sha": obs.base, "activation_snapshot": {}},
            lease,
        )
        self.assertEqual(result["status"], "BLOCKED")
        self.assertTrue(result["reason"].startswith("AUTHORIZATION_INVALID:"))

'''
          if anchor not in s:
              raise SystemExit('test insertion anchor missing')
          p.write_text(s.replace(anchor, insert + anchor, 1))
          PY
          python -m unittest tests.test_l5_controller
      - name: Commit tests
        run: |
          git config user.name 'l5-finalize[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_l5_controller.py
          git commit -m 'test(l5): cover bridge and merge-lock freeze guards'
          git push origin HEAD:l5/claude-hostile-controller

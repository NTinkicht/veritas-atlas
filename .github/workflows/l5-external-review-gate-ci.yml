name: L5 External Review Gate CI

on:
  pull_request:
    paths:
      - 'scripts/onecompany_external_review_gate.py'
      - 'tests/test_onecompany_external_review_gate.py'
      - '.github/workflows/l5-external-review-gate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signed-external-review:
    name: Trusted review provenance regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile exact provenance gate and tests
        run: |
          python -I -m py_compile scripts/onecompany_external_review_gate.py tests/test_onecompany_external_review_gate.py
      - name: Execute positive and adversarial chain tests
        run: |
          python -I -m unittest discover -s tests -p 'test_onecompany_external_review_gate.py' -v

name: L5 Certification Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_certification.py'
      - 'tests/test_l5_certification.py'
      - 'scripts/l5_recovery.py'
      - '.github/workflows/l5-certification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile certification harness
        run: python -m py_compile scripts/l5_certification.py tests/test_l5_certification.py
      - name: Run deterministic certification matrix
        run: python scripts/l5_certification.py
      - name: Run certification regression tests
        run: python tests/test_l5_certification.py
      - name: Verify optimized mode
        run: python -O scripts/l5_certification.py
